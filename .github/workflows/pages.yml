name: Publish site

on:
  push:
    branches: [main]
    paths: ["site/**", "data/**", ".github/workflows/pages.yml"]
  # Data commits made by the hourly job don't trigger 'push' workflows,
  # so also publish whenever that job finishes.
  workflow_run:
    workflows: ["Fetch HSE report", "Backfill history"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # latest commit, including data the fetch job just pushed
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r site/* _site/
          cp data/latest.json data/history.json data/locations.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
