name: Backfill history

# Manual only: Actions tab -> "Backfill history" -> Run workflow -> enter dates.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2026-10-01"
      end:
        description: "End date (YYYY-MM-DD, blank = today)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch          # never runs at the same time as the hourly update
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Backfill
        id: backfill
        run: python -m edtracker backfill ${{ inputs.start }} ${{ inputs.end }}
        continue-on-error: true

      - name: Keep PDFs that failed to parse (download from this run's page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-pdfs
          path: data/failed/
          if-no-files-found: ignore

      - name: Commit data
        run: |
          git config user.name "hse-ed-tracker bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: backfill ${{ inputs.start }} to ${{ inputs.end || 'today' }}"
            git pull --rebase
            git push
          fi
